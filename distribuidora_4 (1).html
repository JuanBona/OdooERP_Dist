<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rincón del Sur — Sistema de gestión comercial</title>
<style>
:root{
  --bg:#F8F3F1; --surface:#FFFFFF; --surface2:#F1E6E2; --ink:#311B16; --ink2:#7C625B;
  --line:#E5D6D1; --accent:#C03028; --accent-ink:#FFFFFF; --brand:#C03028; --brand-dark:#8E211B; --brand2:#1E5FBF;
  --pend:#B98A00; --pend-bg:#FFF3CC; --prep:#C15E08; --prep-bg:#FFE4CC; --listo:#1E5FBF; --listo-bg:#DCE9FF;
  --entr:#1B7F46; --entr-bg:#D9F2E3; --danger:#8E211B; --danger-bg:#F8DBD8;
  --aut:#6B21A8; --aut-bg:#F0E3FA; --emit:#44576B; --emit-bg:#E3EAF1; --pconf:#0E7490; --pconf-bg:#D5F0F6;
  --radius:14px; --shadow:0 1px 3px rgba(72,22,17,.08),0 4px 14px rgba(72,22,17,.07);
}
body.dark{
  --bg:#171011; --surface:#231718; --surface2:#301F20; --ink:#F4E8E6; --ink2:#BC9E99;
  --line:#3E2A2A; --accent:#E0554B; --accent-ink:#FFFFFF; --brand:#B32B23; --brand-dark:#7E1B15; --brand2:#7FB0F2;
  --pend-bg:#3A3110; --prep-bg:#3D2A12; --listo-bg:#16283F; --entr-bg:#12301F; --danger:#F0857C; --danger-bg:#3F1815;
  --aut:#CDA3EE; --aut-bg:#2C1B3C; --emit:#A9BBCE; --emit-bg:#212B36; --pconf:#7DD3E8; --pconf-bg:#0F2C36;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--listo);outline-offset:1px}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;font-weight:750;margin-bottom:10px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink2);font-size:13px}
.topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.topbar .tit{font-weight:800;letter-spacing:.02em}
.topbar .sub{font-size:11px;opacity:.75}
.topbar .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.12)}
.iconbtn:hover{background:rgba(255,255,255,.22)}
nav.tabs{position:sticky;top:54px;z-index:39;display:flex;gap:4px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);padding:6px 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;padding:8px 13px;border-radius:99px;font-weight:650;font-size:13.5px;color:var(--ink2);white-space:nowrap}
nav.tabs button.on{background:var(--brand);color:#fff}
main{max-width:1060px;margin:0 auto;padding:16px 14px 110px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.kpi .num{font-size:28px;font-weight:850;letter-spacing:-.03em}
.kpi .lbl{font-size:12.5px;color:var(--ink2);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font-weight:750;border-radius:11px;padding:11px 16px}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.brand{background:var(--brand-dark);color:#fff}
.btn.dngr{background:var(--danger);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.blk{width:100%}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.st-porAutorizar{background:var(--aut-bg);color:var(--aut)}
.st-autorizado{background:var(--emit-bg);color:var(--emit)}
.st-porConfirmar{background:var(--pconf-bg);color:var(--pconf)}
.st-pendiente{background:var(--pend-bg);color:var(--pend)}
.st-preparando{background:var(--prep-bg);color:var(--prep)}
.st-preparado{background:var(--listo-bg);color:var(--listo)}
.st-entregado{background:var(--entr-bg);color:var(--entr)}
.st-rechazado{background:var(--danger-bg);color:var(--danger)}
.chip.warn{background:var(--danger-bg);color:var(--danger)}
.chip.promo{background:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:hover{background:var(--surface2)}
.avatar{width:40px;height:40px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--brand);flex:none}
.pimg{border-radius:12px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;flex:none}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--accent)}
.pcard .pimg{width:100%;height:130px;border-radius:0}
.pcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.pcard .nm{font-weight:700;font-size:13.5px;line-height:1.25}
.pcard .pr{font-weight:850;font-size:16px;margin-top:auto}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.stepper button{width:42px;height:42px;font-size:20px;font-weight:800;background:var(--surface2)}
.stepper input{width:56px;text-align:center;border:none;border-radius:0;font-weight:800;font-size:16px;padding:8px 0}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 -4px 20px rgba(0,0,0,.18)}
.cartbar .tot{font-size:18px;font-weight:850}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters>*{flex:1;min-width:130px}
.filters input[type=search]{min-width:180px;flex:2}
.modal-back{position:fixed;inset:0;background:rgba(10,20,16,.55);z-index:60;display:grid;place-items:end center;padding:0}
.modal{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:18px 18px 24px}
@media(min-width:640px){.modal-back{place-items:center;padding:20px}.modal{border-radius:18px}}
.check-line{display:flex;align-items:center;gap:12px;padding:13px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.check-line.done{background:var(--entr-bg);border-color:var(--entr);text-decoration:line-through;color:var(--ink2)}
.check-line .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;flex:none;background:var(--surface)}
.check-line.done .box{background:var(--entr);border-color:var(--entr);color:#fff}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
.bar-row .lb{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar-row .tr{flex:1;background:var(--surface2);border-radius:6px;height:20px;overflow:hidden}
.bar-row .fl{height:100%;background:var(--brand);border-radius:6px;min-width:3px}
.bar-row .vl{width:88px;flex:none;text-align:right;font-weight:700;font-size:12.5px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#C03028 0%,#6E1712 75%)}
.login-card{background:var(--surface);border-radius:20px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.demo-users{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.demo-users button{border:1px solid var(--line);border-radius:11px;padding:10px 6px;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center}
.demo-users button:hover{border-color:var(--accent);background:var(--surface2)}
.demo-users .rl{font-size:10px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--ink2)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.hab-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.hab-card .info{flex:1;min-width:0}
.hab-card .nm{font-weight:700;font-size:13.5px}
.tag-last{font-size:11px;font-weight:700;background:var(--accent);border-radius:6px;padding:1px 7px;display:inline-block;color:#fff}
.banner-img{display:block;max-width:100%;border-radius:10px}
.topbar .banner-img{height:40px;width:auto;border-radius:6px}
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;font-family:Georgia,serif;color:#000;padding:10mm}
  #printArea h1{font-size:20pt;margin-bottom:4mm}
  #printArea table{width:100%;border-collapse:collapse;font-size:11pt}
  #printArea th,#printArea td{border:1px solid #000;padding:2mm 3mm;text-align:left}
  #printArea .meta{margin-bottom:5mm;font-size:11pt;line-height:1.7}
}
</style>
</head>

function enOferta(p){return !!config.descuentos.find(d=>d.prodId===p.id)}

// Ordena productos con ofertas primero
function ordenarOfertas(list){return [...list].sort((a,b)=>(enOferta(b)?1:0)-(enOferta(a)?1:0))}
function precioUnit(p,c){let pr=p.precio;const l=config.listas.find(x=>x.id===(c?c.lista:"A"));if(l)pr*=(1-l.desc/100);return pr}
// Descuento por cantidad para un producto (de la tabla configurable)
function descuentoDe(pid){return config.descuentos.find(d=>d.prodId===pid)}
// Calcula una línea con la REGLA: la promo aplica solo a las unidades que cumplen el mínimo.
// Ej: promo por 5 y hay 6 → 5 con descuento, 1 sin. Devuelve {total, ahorro, unConDesc, pct}
// noPromo: set de prodId con la promo anulada manualmente
function calcLinea(p,cant,c,noPromo){
  const pu=precioUnit(p,c);
  const d=descuentoDe(p.id);
  if(!d||cant<d.minCant||(noPromo&&noPromo.has(p.id))){
    return {total:pu*cant,ahorro:0,unConDesc:0,pct:d?d.pct:0,aplicable:!!d&&cant>=d.minCant};
  }
  // cuántos grupos completos del mínimo entran
  const grupos=Math.floor(cant/d.minCant);
  const conDesc=grupos*d.minCant;
  const sinDesc=cant-conDesc;
  const total=conDesc*pu*(1-d.pct/100)+sinDesc*pu;
  return {total,ahorro:conDesc*pu*(d.pct/100),unConDesc:conDesc,pct:d.pct,aplicable:true};
}
function lineaTotal(p,cant,c,noPromo){return calcLinea(p,cant,c,noPromo).total}
function pedidoTotal(pd){const c=cli(pd.clienteId);return pd.items.reduce((s,[pid,q])=>s+lineaTotal(prod(pid),q,c,pd.noPromo?new Set(pd.noPromo):null),0)}

// ===== Período de 4 semanas (28 días) =====
function periodoActual(){
  const ini=new Date(config.periodoInicio);const now=new Date(hoy);
  const dias=Math.floor((now-ini)/(1000*60*60*24));
  const idx=Math.floor(dias/28);
  const desde=new Date(ini);desde.setDate(desde.getDate()+idx*28);
  const hasta=new Date(desde);hasta.setDate(hasta.getDate()+27);
  return {idx,desde:desde.toISOString().slice(0,10),hasta:hasta.toISOString().slice(0,10)};
}
function enPeriodo(fecha,per){per=per||periodoActual();return fecha>=per.desde&&fecha<=per.hasta}

function estadoCuenta(c){

  if(c.saldo<0)return {txt:"Debe "+fmt(-c.saldo),cls:"warn"};
  return {txt:"Al día",cls:"st-preparado"};
}

/* ================= CARRITO ================= */
function cartCount(){return Object.values(S.cart.items).reduce((a,b)=>a+b,0)}
function cartTotal(){const c=cli(S.cart.clienteId);const np=S.cart.noPromo||new Set();return Object.entries(S.cart.items).reduce((s,[pid,q])=>s+lineaTotal(prod(+pid),q,c,np),0)}
function setQty(pid,q){q=Math.max(0,Math.min(q,prod(pid).stock));if(q===0)delete S.cart.items[pid];else S.cart.items[pid]=q;render()}
function addQty(pid,d){setQty(pid,(S.cart.items[pid]||0)+d)}
function togglePromo(pid){if(!S.cart.noPromo)S.cart.noPromo=new Set();if(S.cart.noPromo.has(pid))S.cart.noPromo.delete(pid);else S.cart.noPromo.add(pid);render()}
function enviarPedido(){
 if(!S.cart.clienteId){toast("Elegí un cliente primero");return}
 if(cartCount()===0){toast("El pedido está vacío");return}
 const items=Object.entries(S.cart.items).map(([pid,q])=>[+pid,q]);
 // Congelar costo y precio al momento de la venta (para valorización histórica correcta)
 const snap={};
 items.forEach(([pid,q])=>{const p=prod(pid);p.stock-=q;snap[pid]={costo:p.costo,precio:p.precio};movs.unshift({fecha:D(0),tipo:"salida",prodId:pid,cant:q,ref:"Pedido #"+pedidoSeq})});
 pedidos.unshift({id:pedidoSeq,clienteId:S.cart.clienteId,vendedorId:S.user.rol==="vendedor"?S.user.id:(S.user.rol==="cliente"?cli(S.cart.clienteId).vendedorId:2),fecha:D(0),estado:"porAutorizar",obs:S.cart.obs,items,chk:[],snap,noPromo:S.cart.noPromo?[...S.cart.noPromo]:[]});
 toast("Pedido #"+pedidoSeq+" enviado para autorización ✔");pedidoSeq++;
 S.cart={clienteId:S.user.rol==="cliente"?S.user.clienteId:null,items:{},obs:""};go(S.user.rol==="vendedor"?"dash":"pedidos");
}

 }
 const emitido=!["porAutorizar","autorizado"].includes(p.estado);

  ${p.obs?`<p style="margin-top:8px;background:var(--pend-bg);color:var(--pend);padding:8px 12px;border-radius:10px">📝 ${esc(p.obs)}</p>`:""}

  <div class="row between" style="margin-top:12px;font-size:18px"><b>Total</b><b>${fmt(pedidoTotal(p))}</b></div>
  ${p.estado==="porAutorizar"&&!admin?'<p class="muted" style="margin-top:10px">⏳ Esperando autorización del administrador.</p>':""}
  <div class="row" style="margin-top:14px;flex-wrap:wrap">
   ${acciones}
   ${admin||(emitido&&S.user.rol!=="cliente")?`<button class="btn sec" onclick="imprimirHoja(${p.id})">🖨 Hoja de preparación</button>`:""}
   ${admin&&["preparado","entregado"].includes(p.estado)?(fac?`<button class="btn sec" onclick="imprimirRemito(${p.id})">📄 Reimprimir remito ${fac.num}</button>`:`<button class="btn sec" onclick="generarRemito(${p.id})">📄 Generar remito</button>`):""}

function autorizar(id){const p=pedidos.find(x=>x.id===id);p.estado="autorizado";p.autorizadoPor=S.user.nombre;
 toast("Pedido #"+id+" autorizado ✔ Ahora podés emitirlo a depósito");render()}

function anular(id){if(!confirm("¿Anular el pedido #"+id+"? Se devuelve el stock reservado."))return;
 const p=pedidos.find(x=>x.id===id);
 p.items.forEach(([pid,q])=>{prod(pid).stock+=q;movs.unshift({fecha:D(0),tipo:"entrada",prodId:pid,cant:q,ref:"Anulación pedido #"+id})});
 pedidos.splice(pedidos.indexOf(p),1);toast("Pedido #"+id+" anulado, stock devuelto");go("pedidos")}
function rechazarEntrega(id){if(!confirm("¿El cliente rechazó el pedido #"+id+"? La mercadería vuelve al stock."))return;
 const p=pedidos.find(x=>x.id===id);
 p.items.forEach(([pid,q])=>{prod(pid).stock+=q;movs.unshift({fecha:D(0),tipo:"entrada",prodId:pid,cant:q,ref:"Rechazo entrega pedido #"+id})});
 p.estado="rechazado";p.devuelto=true;toast("Pedido #"+id+" rechazado, stock reintegrado ✔");render()}
function devolverStock(id){if(!confirm("¿Devolver al stock la mercadería del pedido #"+id+"? (no fue entregado)"))return;
 const p=pedidos.find(x=>x.id===id);
 p.items.forEach(([pid,q])=>{prod(pid).stock+=q;movs.unshift({fecha:D(0),tipo:"entrada",prodId:pid,cant:q,ref:"Devolución pedido #"+id})});

function edPedSet(id,i,nq){const p=pedidos.find(x=>x.id===id);const [pid,q]=p.items[i];const pr=prod(pid);
 nq=Math.max(0,nq);const d=nq-q;
 if(d>0&&pr.stock<d){toast("Stock insuficiente: quedan "+pr.stock);render();return}
 pr.stock-=d;
 if(d!==0)movs.unshift({fecha:D(0),tipo:d>0?"salida":"entrada",prodId:pid,cant:Math.abs(d),ref:"Modif. pedido #"+id});
 if(nq===0)p.items.splice(i,1);else p.items[i]=[pid,nq];
 render()}
function edPedQty(id,i,d){const p=pedidos.find(x=>x.id===id);edPedSet(id,i,p.items[i][1]+d)}
function edPedAdd(id){const p=pedidos.find(x=>x.id===id);const pid=+$("ep-prod").value;const q=Math.max(1,parseInt($("ep-cant").value)||1);
 if(!pid){toast("No hay productos para agregar");return}
 const pr=prod(pid);if(pr.stock<q){toast("Stock insuficiente: quedan "+pr.stock);return}
 pr.stock-=q;p.items.push([pid,q]);
 movs.unshift({fecha:D(0),tipo:"salida",prodId:pid,cant:q,ref:"Modif. pedido #"+id});
 toast("Agregado al pedido");render()}

// Hoja CONSOLIDADA por vendedor: junta todos sus pedidos a preparar y suma iguales (para cargar el camión)
function imprimirHojaVendedor(vid){
 const v=usr(vid);
 const ped=pedidos.filter(p=>p.vendedorId===vid&&["pendiente","preparando","porConfirmar"].includes(p.estado));
 if(!ped.length){toast("Ese vendedor no tiene pedidos para preparar");return}
 // Sumar cantidades por producto a través de todos los pedidos

 ped.forEach(p=>p.items.forEach(([pid,q])=>{acum[pid]=(acum[pid]||0)+q}));

/* ================= FINANZAS ================= */
// Costo congelado de un ítem: usa el snapshot del pedido si existe (valorización histórica)
function costoItem(p,pid){return (p.snap&&p.snap[pid]?p.snap[pid].costo:prod(pid).costo)}
// Ventas que cuentan como ingreso: entregadas y no devueltas
function ventasComputables(per){return pedidos.filter(p=>p.estado==="entregado"&&!p.devuelto&&(!per||enPeriodo(p.fecha,per)))}
function finanzasPeriodo(per){
 const vts=ventasComputables(per);
 let ingresos=0,costos=0;
 vts.forEach(p=>{const c=cli(p.clienteId);const np=p.noPromo?new Set(p.noPromo):null;
   p.items.forEach(([pid,q])=>{ingresos+=lineaTotal(prod(pid),q,c,np);costos+=costoItem(p,pid)*q})});
 const gs=gastos.filter(g=>!per||enPeriodo(g.fecha,per)).reduce((s,g)=>s+g.monto,0);
 const bruto=ingresos-costos;
 return {ingresos,costos,bruto,gastos:gs,neto:bruto-gs};
}
function vFinanzas(){
 const per=periodoActual();const fin=finanzasPeriodo(per);
 // gastos por categoría

  <div class="card kpi" style="border-color:var(--brand)"><div class="num" style="color:var(--brand)">${fmt(fin.neto)}</div><div class="lbl">Ganancia neta</div></div>
 </div>

 <div class="card" style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Detalle</th><th>Caja</th><th>Monto</th></tr></thead><tbody>
 ${gastos.filter(g=>enPeriodo(g.fecha,per)).map(g=>`<tr><td>${g.fecha}</td><td>${esc(g.categoria)}</td><td class="muted">${esc(g.detalle||"—")}${g.vendedorId?" · "+esc(usr(g.vendedorId).nombre.split(" ")[0]):""}</td><td><span class="chip st-preparado">${esc(g.medio)}</span></td><td style="font-weight:700;color:var(--danger)">− ${fmt(g.monto)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">Sin gastos en este período.</td></tr>'}</tbody></table></div>

/* ================= CAJAS (balance monetario por medio de pago) ================= */
function vCajas(){
 const per=periodoActual();
 // saldo por medio: cobros (entra) - gastos (sale)
 const saldos={};MEDIOS.forEach(m=>saldos[m]={entra:0,sale:0});
 cobros.filter(c=>enPeriodo(c.fecha,per)).forEach(c=>{if(saldos[c.medio])saldos[c.medio].entra+=c.monto});
 gastos.filter(g=>enPeriodo(g.fecha,per)).forEach(g=>{if(saldos[g.medio])saldos[g.medio].sale+=g.monto});
 return `<div class="sec-h" style="margin-top:0"><h1>Cajas por medio de pago</h1><span class="muted">${per.desde} → ${per.hasta}</span></div>
 <p class="muted">Cada cobro y cada gasto se asigna a una caja (efectivo, transferencia, cheque, tarjeta). Así, además del stock de mercadería, tenés un balance monetario por caja para controlar a los vendedores.</p>
 <div class="grid g2" style="margin-top:12px">${MEDIOS.map(m=>{const s=saldos[m];const bal=s.entra-s.sale;return `<div class="card">
  <div class="row between"><b style="font-size:16px">${m}</b><span class="chip ${bal>=0?"st-entregado":"warn"}" style="font-size:14px">${fmt(bal)}</span></div>
  <div class="row between muted" style="margin-top:6px"><span>↓ Cobros</span><span style="color:var(--entr)">${fmt(s.entra)}</span></div>
  <div class="row between muted"><span>↑ Gastos</span><span style="color:var(--danger)">${fmt(s.sale)}</span></div></div>`}).join("")}</div>
 <div class="sec-h"><h2>Cobros registrados</h2><button class="btn sm" onclick="go('nuevoCobro')">＋ Registrar cobro</button></div>
 <div class="card" style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th>Medio</th><th>Monto</th></tr></thead><tbody>
 ${cobros.filter(c=>enPeriodo(c.fecha,per)).map(c=>`<tr><td>${c.fecha}</td><td>${esc(cli(c.clienteId).nombre)}</td><td>${esc(usr(c.vendedorId).nombre.split(" ")[0])}</td><td><span class="chip st-preparado">${esc(c.medio)}</span></td><td style="font-weight:700;color:var(--entr)">${fmt(c.monto)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">Sin cobros registrados. Los vendedores informan por qué medio cobraron.</td></tr>'}</tbody></table></div>`}
function vNuevoCobro(){
 return `<button class="btn sm sec" onclick="go('cajas')">← Cajas</button>
 <h1 style="margin-top:12px">Registrar cobro</h1>
 <p class="muted">El vendedor indica por qué medio cobró. Si cobró con varios medios, se cargan por separado.</p>
 <div class="card" style="margin-top:12px;max-width:520px"><div class="grid g2">
  <div class="field"><label>Cliente</label><select id="co-cli">${clientes.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select></div>
  <div class="field"><label>Vendedor</label><select id="co-vend">${usuarios.filter(u=>u.rol==="vendedor").map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join("")}</select></div>
  <div class="field"><label>Medio de pago (caja)</label><select id="co-medio">${MEDIOS.map(m=>`<option>${m}</option>`).join("")}</select></div>
  <div class="field"><label>Monto ($)</label><input type="number" min="0" id="co-monto" value="0"></div>
 </div><button class="btn" onclick="guardarCobro()">Registrar cobro</button></div>`}
function guardarCobro(){const monto=Math.max(0,parseInt($("co-monto").value)||0);
 if(monto<=0){toast("Ingresá un monto válido");return}
 const cid=+$("co-cli").value;
 cobros.unshift({fecha:D(0),clienteId:cid,vendedorId:+$("co-vend").value,medio:$("co-medio").value,monto,pedidoId:null});
 cli(cid).saldo+=monto; // suma a favor / cancela deuda
 toast("Cobro registrado en caja "+$("co-medio").value+" ✔");go("cajas")}

/* ================= REPORTES ================= */
// valFn recibe (pedido, prod, cant, cliente) para poder usar costo congelado
function agg(keyFn,valFn,per){const m={};pedidos.filter(p=>!per||enPeriodo(p.fecha,per)).forEach(p=>{const c=cli(p.clienteId);const np=p.noPromo?new Set(p.noPromo):null;
 p.items.forEach(([pid,q])=>{const k=keyFn(p,prod(pid));m[k]=(m[k]||0)+valFn(p,prod(pid),q,c,np)})});
 return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(data,money=true){const max=Math.max(...data.map(d=>d[1]),1);
 return data.slice(0,8).map(([k,v])=>`<div class="bar-row"><div class="lb" title="${esc(k)}">${esc(k)}</div>
 <div class="tr"><div class="fl" style="width:${Math.round(v/max*100)}%"></div></div>
 <div class="vl">${money?fmt(v):v}</div></div>`).join("")}
function vReportes(){
 const per=periodoActual();
 const LT=(p,pr,q,c,np)=>lineaTotal(pr,q,c,np);
 const porProd=agg((p,pr)=>pr.nombre,LT,per);
 const porCli=agg(p=>cli(p.clienteId).nombre,LT,per);
 const porVen=agg(p=>usr(p.vendedorId).nombre,LT,per);
 const porMarca=agg((p,pr)=>pr.marca,LT,per);
 const porDia=agg(p=>p.fecha,LT,per).sort((a,b)=>a[0]<b[0]?-1:1);
 const rank=agg((p,pr)=>pr.nombre,(p,pr,q)=>q,per);
 // Valorización histórica: usa el costo congelado en cada venta
 const valoriz=agg((p,pr)=>pr.nombre,(p,pr,q,c,np)=>lineaTotal(pr,q,c,np)-costoItem(p,pr.id)*q,per);
 const totalPer=ventasComputables(per).reduce((s,p)=>s+pedidoTotal(p),0);
 return `<div class="sec-h" style="margin-top:0"><h1>Reportes</h1><span class="muted">${per.desde} → ${per.hasta}</span></div>
 <p class="muted">Cortes cada 4 semanas. Ventas del período: <b style="color:var(--ink)">${fmt(totalPer)}</b></p>
 <div class="grid g2" style="margin-top:14px">
 <div class="card"><h2>Ventas por producto</h2>${bars(porProd)}</div>
 <div class="card"><h2>Ventas por cliente</h2>${bars(porCli)}</div>
 <div class="card"><h2>Ventas por vendedor</h2>${bars(porVen)}</div>
 <div class="card"><h2>Ventas por marca</h2>${bars(porMarca)}</div>
 <div class="card"><h2>Ventas por día</h2>${bars(porDia)}</div>
 <div class="card"><h2>Ranking de productos (unidades)</h2>${bars(rank,false)}</div>
 <div class="card"><h2>Ganancia por producto (valorización histórica)</h2>${bars(valoriz)}
  <p class="muted" style="font-size:12px;margin-top:8px">Usa el costo congelado al momento de cada venta: cambiar hoy el precio de costo no altera lo ya vendido.</p></div></div>`}

/* ================= CONFIGURACIÓN ================= */
function vConfig(){
 return `<h1>Configuración</h1>
 <div class="grid g2" style="margin-top:12px">
 <div class="card"><h2>Empresa</h2>
  <div class="field"><label>Nombre</label><input value="${esc(config.empresa)}" onchange="config.empresa=this.value;toast('Guardado');render()"></div>
  <div class="field"><label>CUIT</label><input value="${esc(config.cuit)}" onchange="config.cuit=this.value;toast('Guardado')"></div>
  <div class="field"><label>Dirección</label><input value="${esc(config.dir)}" onchange="config.dir=this.value;toast('Guardado')"></div>
  <div class="grid" style="gap:8px"><img class="banner-img" src="${LOGO}" alt="Logo" style="max-width:280px;border:1px solid var(--line)"><button class="btn sm sec" style="width:fit-content" onclick="toast('Demo: acá se reemplaza el logo de la empresa')">Cambiar logo</button></div></div>
 <div class="card"><h2>Listas de precios</h2>
  ${config.listas.map(l=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(l.nombre)}</b><span class="chip st-preparado">−${l.desc}% s/ base</span></div>`).join("")}
  <p class="muted" style="margin-top:8px">Cada cliente tiene asignada una lista; el catálogo muestra su precio automáticamente.</p></div>
 <div class="card"><h2>Descuentos por cantidad</h2>
  <p class="muted" style="font-size:12px;margin-bottom:8px">Definí a partir de qué cantidad se aplica un % de descuento. Estos productos aparecen como "Ofertas".</p>
  <table><thead><tr><th>Producto</th><th>Desde</th><th>% desc.</th><th></th></tr></thead><tbody>
  ${config.descuentos.map((d,i)=>`<tr><td>${esc(prod(d.prodId).nombre)}</td>
   <td><input type="number" min="1" value="${d.minCant}" style="width:64px;padding:5px" onchange="config.descuentos[${i}].minCant=Math.max(1,parseInt(this.value)||1);toast('Guardado');render()"></td>
   <td><input type="number" min="0" max="90" value="${d.pct}" style="width:64px;padding:5px" onchange="config.descuentos[${i}].pct=Math.max(0,parseInt(this.value)||0);toast('Guardado');render()"></td>
   <td><button class="btn sm dngr" onclick="config.descuentos.splice(${i},1);toast('Eliminado');render()">✕</button></td></tr>`).join("")}
  </tbody></table>
  <div class="row" style="margin-top:8px;flex-wrap:wrap">
   <select id="nd-prod" style="flex:2;min-width:150px">${productos.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join("")}</select>
   <input type="number" id="nd-min" placeholder="Desde" value="6" style="width:80px">
   <input type="number" id="nd-pct" placeholder="%" value="10" style="width:70px">
   <button class="btn sm" onclick="agregarDescuento()">＋ Agregar</button></div></div>
 <div class="card"><h2>Categorías y marcas</h2>
  <p style="margin-bottom:8px">${CATS.map(c=>`<span class="chip st-preparado" style="margin:2px">${c}</span>`).join("")}</p>
  <p>${MARCAS.map(m=>`<span class="chip" style="background:var(--surface2);margin:2px">${m}</span>`).join("")}</p></div>
 <div class="card"><h2>Parámetros comerciales</h2>
  <div class="field"><label>Comisión de vendedores (% sobre lo vendido)</label><input type="number" min="0" max="50" value="${comisionPct}" onchange="comisionPct=Math.max(0,parseInt(this.value)||0);toast('Guardado');render()"></div>
  <div class="field"><label>Inicio del período de 4 semanas</label><input type="date" value="${config.periodoInicio}" onchange="config.periodoInicio=this.value;toast('Guardado');render()"></div>
  <p class="muted" style="font-size:12px">Los cortes de reportes y finanzas son cada 28 días desde esta fecha (no por mes calendario).</p></div>
 <div class="card"><h2>Impresoras</h2>${config.impresoras.map(i=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>🖨 ${esc(i)}</span><span class="chip st-entregado">Conectada</span></div>`).join("")}</div>
 </div>`}
function agregarDescuento(){const pid=+$("nd-prod").value,min=Math.max(1,parseInt($("nd-min").value)||1),pct=Math.max(0,parseInt($("nd-pct").value)||0);
 if(config.descuentos.find(d=>d.prodId===pid)){toast("Ese producto ya tiene un descuento configurado");return}
 config.descuentos.push({id:Date.now(),prodId:pid,minCant:min,pct});toast("Descuento agregado ✔");render()}

/* ================= ROUTER ================= */
function render(){
 const V={login:vLogin,dash:vDash,clientes:vClientes,clienteDetalle:vClienteDetalle,pedidoExpress:vPedidoExpress,
  catalogo:vCatalogo,producto:vProducto,confirmar:vConfirmar,pedidos:vPedidos,pedidoDetalle:vPedidoDetalle,editarPedido:vEditarPedido,
  deposito:vDeposito,depoPedido:vDepoPedido,stock:vStock,articulos:vArticulos,compras:vCompras,usuarios:vUsuarios,reportes:vReportes,config:vConfig,finanzas:vFinanzas,cajas:vCajas,nuevoGasto:vNuevoGasto,nuevoCobro:vNuevoCobro};
 const fn=V[S.view]||vLogin;
 $("app").innerHTML=S.view==="login"?fn():shell(fn());
}
render();
</script>
